<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0f1117"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4a7fd4" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#0f1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c9eff"/>
      <stop offset="100%" stop-color="#7c5cbf"/>
    </linearGradient>
  </defs>
  <!-- puzzle grid accent -->
  <g opacity="0.15">
    <rect x="900" y="80" width="60" height="60" rx="8" fill="#6c9eff"/>
    <rect x="970" y="80" width="60" height="60" rx="8" fill="#7c5cbf"/>
    <rect x="900" y="150" width="60" height="60" rx="8" fill="#7c5cbf"/>
    <rect x="970" y="150" width="60" height="60" rx="8" fill="#6c9eff"/>
  </g>
  <!-- logo mark -->
  <rect x="100" y="215" width="80" height="80" rx="18" fill="#1e2230"/>
  <rect x="108" y="223" width="28" height="28" rx="4" fill="#6c9eff"/>
  <rect x="144" y="223" width="28" height="28" rx="4" fill="#7c5cbf"/>
  <rect x="108" y="259" width="28" height="28" rx="4" fill="#7c5cbf"/>
  <rect x="144" y="259" width="28" height="28" rx="4" fill="#6c9eff"/>
  <!-- text -->
  <text x="210" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#title)">Puzzle Stats</text>
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="500" fill="#9aa3b5">Track your puzzle solves</text>
  <text x="100" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#6b7280">Catalog · Time · Milestones · Statistics</text>
  <text x="100" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#6c9eff">puzzlestats.app</text>
</svg>
